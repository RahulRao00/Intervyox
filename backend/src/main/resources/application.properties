spring.application.name=intervyox-backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/intervyox?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:intervyox_user}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Security & JWT
app.jwt.secret=${JWT_SECRET:v8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# AI Settings
ai.provider=${AI_PROVIDER:gemini}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:20}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Demo Admin Account Seeding
intervyox.seed.admin.enabled=${SEED_ADMIN_ENABLED:true}
intervyox.seed.admin.email=${ADMIN_EMAIL:admin@intervyox.com}
intervyox.seed.admin.password=${ADMIN_PASSWORD:admin12345}
intervyox.seed.admin.name=System Administrator

# SpringDoc OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
