spring.application.name=intervyox-backend

# Database (values come from environment variables, never commit real secrets)
spring.datasource.url=jdbc:mysql://localhost:3306/intervyox?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (secret must be at least 32 characters)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
